name: Convert GeoGaga DAT to Mihomo Rules

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Download GeoGaga DAT files
        run: |
          mkdir -p temp rules
          curl -fsSL -o temp/geosite.dat https://github.com/bratishkadrugoimamysynishka/geogaga-client-flavor/releases/latest/download/geosite.dat
          curl -fsSL -o temp/geoip.dat https://github.com/bratishkadrugoimamysynishka/geogaga-client-flavor/releases/latest/download/geoip.dat

      - name: Install v2dat
        run: |
          curl -fsSL -o v2dat.tar.gz https://github.com/urlesistiana/v2dat/releases/download/v1.6.0/v2dat_1.6.0_Linux_x86_64.tar.gz
          tar -xvf v2dat.tar.gz v2dat
          chmod +x v2dat

      - name: Unpack DAT to TXT
        run: |
          mkdir -p txt
          ./v2dat unpack geosite -d ./txt -f geogaga-block temp/geosite.dat || true
          ./v2dat unpack geosite -d ./txt -f geogaga-direct temp/geosite.dat || true
          ./v2dat unpack geosite -d ./txt -f geogaga-proxy temp/geosite.dat || true
          ./v2dat unpack geoip -d ./txt -f geogaga-block temp/geoip.dat || true
          ./v2dat unpack geoip -d ./txt -f geogaga-direct temp/geoip.dat || true
          ./v2dat unpack geoip -d ./txt -f geogaga-proxy temp/geoip.dat || true

      - name: Convert TXT to Mihomo YAML
        run: |
          for f in txt/*_geosite_*.txt; do
            [ -f "$f" ] || continue
            out="rules/$(basename "${f%.txt}").yaml"
            echo "payload:" > "$out"
            awk -F: '
              $1=="domain" {print "  - DOMAIN-SUFFIX," $2}
              $1=="full"   {print "  - DOMAIN," $2}
              $1=="keyword"{print "  - DOMAIN-KEYWORD," $2}
              $1=="regexp" {print "  - DOMAIN-REGEX," $2}
            ' "$f" >> "$out"
          done

          for f in txt/*_geoip_*.txt; do
            [ -f "$f" ] || continue
            out="rules/$(basename "${f%.txt}").yaml"
            echo "payload:" > "$out"
            awk '{print "  - IP-CIDR," $0 ",no-resolve"}' "$f" >> "$out"
          done

      - name: Commit & Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/*.yaml
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update GeoGaga rules [skip ci]"
          git push
