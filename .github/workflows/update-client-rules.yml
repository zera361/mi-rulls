name: Convert GeoGaga Client DAT to Mihomo Rules

on:
  schedule:
    - cron: '0 3 * * *' # Запуск каждый день в 03:00 UTC
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чеккаут вашего репозитория
        uses: actions/checkout@v4

      - name: Скачивание актуальных клиентских .dat файлов
        run: |
          mkdir -p temp
          curl -sSL -o temp/geosite.dat https://github.com/bratishkadrugoimamysynishka/geogaga-client-flavor/releases/latest/download/geosite.dat
          curl -sSL -o temp/geoip.dat https://github.com/bratishkadrugoimamysynishka/geogaga-client-flavor/releases/latest/download/geoip.dat

      - name: Установка конвертера v2dat
        run: |
          curl -sSL -o v2dat.tar.gz https://github.com/uraimo/v2dat/releases/download/v1.6.0/v2dat_1.6.0_Linux_x86_64.tar.gz
          tar -xvf v2dat.tar.gz v2dat
          chmod +x v2dat

      - name: Распаковка DAT в YAML форматы для Mihomo
        run: |
          mkdir -p rules
          
          # 1. Извлекаем Домены (geosite)
          ./v2dat unpack geosite -o ./rules -f geogaga-block temp/geosite.dat
          ./v2dat unpack geosite -o ./rules -f geogaga-direct temp/geosite.dat
          ./v2dat unpack geosite -o ./rules -f geogaga-proxy temp/geosite.dat
          
          # 2. Извлекаем IP-адреса (geoip)
          ./v2dat unpack geoip -o ./rules -f geogaga-direct temp/geoip.dat
          ./v2dat unpack geoip -o ./rules -f geogaga-proxy temp/geoip.dat

      - name: Сохранение результатов в репозиторий
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/*.yaml
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update GeoGaga Client rules [skip ci]"
          git push
